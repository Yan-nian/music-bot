name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - name: ruff
        run: ruff check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile all modules
        run: python -m compileall -q main.py config_manager.py download_queue.py cookie_keeper.py config downloaders web tools
      - name: Import smoke
        run: |
          python - <<'PY'
          import main, config_manager, download_queue, cookie_keeper
          import downloaders, downloaders.netease, downloaders.apple_music, downloaders.metadata
          import web.app, web.tg_ui, web.tg_notifier, web.jobs, web.tasks, web.tg_setup
          print('all modules importable')
          PY
      - name: Run tests
        run: pytest
