<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · Music Bot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><path d='M12 22V10l10-2v12' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/><circle cx='10' cy='22' r='2.5' fill='white'/><circle cx='20' cy='20' r='2.5' fill='white'/></svg>">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-mark">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12h2l2-5 3 10 3-14 3 12 2-3h3"/>
        </svg>
      </div>
      <div class="center">
        <div class="auth-title">Music Bot</div>
        <div class="auth-sub">登录以管理下载与订阅</div>
      </div>
    </div>

    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label class="field-label" for="username">用户名</label>
        <input class="input" id="username" name="username" type="text"
               autocomplete="username" placeholder="admin" required>
      </div>
      <div class="field">
        <label class="field-label" for="password">密码</label>
        <input class="input" id="password" name="password" type="password"
               autocomplete="current-password" placeholder="请输入密码" required>
      </div>

      <div class="between" style="margin:2px 0 18px">
        <label class="row small muted-2" style="cursor:pointer;gap:7px">
          <input type="checkbox" id="remember" style="accent-color:var(--brand)">
          记住登录状态
        </label>
      </div>

      <div id="loginError" class="notice notice-error hidden" style="margin-bottom:14px">
        <i data-icon="alert" data-size="16"></i>
        <span id="loginErrorText"></span>
      </div>

      <button class="btn btn-primary" id="loginBtn" type="submit"
              style="width:100%;height:38px">登录</button>
    </form>

    <div class="divider"></div>
    <p class="tiny muted center" style="line-height:1.7">
      首次部署的初始密码打印在容器启动日志里<br>
      <span class="mono">docker logs &lt;容器名&gt;</span> 可查看
    </p>
  </div>
</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script>
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('loginError');
  const errorText = document.getElementById('loginErrorText');
  const btn = document.getElementById('loginBtn');

  function showError(message) {
    errorText.textContent = message;
    errorBox.classList.remove('hidden');
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    errorBox.classList.add('hidden');
    setBusy(btn, true, '登录中…');
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
          remember: document.getElementById('remember').checked,
        }),
      });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.error || '登录失败');
      window.location.href = data.redirect || '/';
    } catch (e) {
      showError(e.message);
      setBusy(btn, false);
      document.getElementById('password').select();
    }
  });

  document.getElementById('username').focus();
</script>
</body>
</html>
